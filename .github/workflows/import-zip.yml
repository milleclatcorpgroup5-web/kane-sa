name: Import KANE SA ZIP and open review PR

on:
  push:
    paths:
      - "KANE_SA_v1.7.0_DEV0_REAL_MONEY_LOCKED.zip"
      - ".github/workflows/import-zip.yml"
  workflow_dispatch:
    inputs:
      confirm_import:
        description: "Konfime ekstraksyon ZIP la epi prepare yon Pull Request pou revizyon."
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  import-source:
    if: ${{ github.event_name == 'push' || inputs.confirm_import }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="KANE_SA_v1.7.0_DEV0_REAL_MONEY_LOCKED.zip"
          test -f "$ARCHIVE" || { echo "ZIP la pa jwenn nan rasin repository a."; exit 1; }
          mkdir -p /tmp/kane-source
          unzip -q "$ARCHIVE" -d /tmp/kane-source
          test -f /tmp/kane-source/KANE_SA/package.json || {
            echo "Estrikti ZIP la pa valab: KANE_SA/package.json manke."
            exit 1
          }
          test -d /tmp/kane-source/KANE_SA/app
          test -d /tmp/kane-source/KANE_SA/supabase
          test -f /tmp/kane-source/KANE_SA/wrangler.jsonc

      - name: Prepare isolated import branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="import/kane-sa-v1.7.0-$(date -u +%Y%m%d-%H%M%S)"
          echo "IMPORT_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"

      - name: Copy source while preserving repository workflows
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.github/workflows/' /tmp/kane-source/KANE_SA/ ./
          test -f package.json
          test -d app
          test -d supabase
          test -f .github/workflows/import-zip.yml
          test -f .github/workflows/ci.yml

      - name: Commit import and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pa gen diferans pou enpòte; pa gen PR ki nesesè."
            exit 0
          fi
          git commit -m "Import KANE SA v1.7.0 source"
          git push --set-upstream origin "$IMPORT_BRANCH"
          gh pr create --base main --head "$IMPORT_BRANCH" \
            --title "Import KANÈ SA v1.7.0 source" \
            --body "## Entegrasyon sous KANÈ SA\n\n- Sous la soti nan achiv v1.7.0-dev.0.\n- Sous aplikasyon an mete sou branch apa; main pa modifye dirèkteman.\n- Workflows repository a rete entak pou evite bezwen GitHub Workflows permission.\n- CI dwe pase anvan merge.\n- Verrou lajan reyèl yo rete fèmen; pa gen deplwaman Production nan PR sa a."
          gh workflow run ci.yml --ref "$IMPORT_BRANCH"
